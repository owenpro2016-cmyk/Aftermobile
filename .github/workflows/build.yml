{name: Build, on: [push, workflow_dispatch], jobs: {build: {runs-on: ubuntu-22.04, steps: [{uses: actions/checkout@v4}, {name: Recojo SDK, run: git clone --depth 1 https://github.com/geode-sdk/geode.git /home/runner/geodesdk}, {name: Apunto SDK, run: echo GEODE_SDK=/home/runner/geodesdk >> $GITHUB_ENV}, {uses: geode-sdk/build-geode-mod@main, with: {combine: true}}]}}}
